# Deploy-time config (restart required). Secrets live in .env, never here.
auth:
  provider: google
  allowedDomains:
    - example.com      # CHANGE: domains allowed to sign in (a Gmail-only team: gmail.com)
  seedAdmins:              # become "approver" on first sign-in
    - admin@example.com   # CHANGE: your email
  defaultRole: viewer      # viewer | editor | approver

limits:
  maxQueryRows: 500
  queryTimeoutMs: 5000
  maxOpsPerProposal: 50
  maxRowsPerDataOp: 1000
  maxScriptBytes: 536870912
  maxScriptRows: 200000
  maxOpsPerScript: 1000
  maxInlineScriptBytes: 20480

embedding:
  model: intfloat/multilingual-e5-small
  dimension: 384

chat:
  provider: openrouter
  defaultModel: anthropic/claude-sonnet-4.5
  # allowedModels seeds the site's model list (Settings > chat models) until an approver changes it there.
  allowedModels:
    - anthropic/claude-sonnet-4.5

# Intelligent query tab (all optional; these are the defaults).
# intelligentQuery:
#   model: ""          # empty = the chat default model
#   maxTables: 8
#   examples: 3
#   memoryHit: 0.95
#   ratePerMinute: 20
#   valueLookupMs: 800

backups:
  retentionDays: 14
