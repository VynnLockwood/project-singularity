name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_APP_USER: postgres
      DB_APP_PASSWORD: postgres
      PGPASSWORD: postgres
      TEST_PG_ADMIN_USER: postgres
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt maturin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # the duplicate finder is the Rust engine, installed as a Python module
      - run: maturin build --release --out /tmp/wheels
        working-directory: engine
      - run: pip install /tmp/wheels/*.whl
      - run: pytest -q
        working-directory: backend

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test
      - run: cargo check --features wasm --target wasm32-unknown-unknown
      # the browser build of the same engine; uploaded so a deploy can drop it into frontend/public/engine
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --release --target web --out-dir ../frontend/public/engine --features wasm
      - uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: frontend/public/engine

  embed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest httpx
      - run: PYTHONPATH=. pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-compose.py
      - name: Validate nginx config
        run: |
          mkdir -p nginx/certs && sh nginx/gen-dev-cert.sh
          docker run --rm --add-host api:127.0.0.1 --add-host web:127.0.0.1 --add-host mcp:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t
