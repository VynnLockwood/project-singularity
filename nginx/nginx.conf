worker_processes auto;

events { worker_connections 1024; }

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker's embedded DNS; re-resolve so nginx survives upstream restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # chunked uploads send 8 MiB parts, so a small body cap is enough however big the file is
    location /api/scripts/uploads {
      client_max_body_size 16m;
      proxy_request_buffering off;
      set $api http://api:8000;
      proxy_pass $api;
    }

    location /api/scripts {
      # the old single-request upload (small files): up to 60 MB
      client_max_body_size 60m;
      set $api http://api:8000;
      proxy_pass $api;
    }

    location /api/ {
      set $api http://api:8000;
      proxy_pass $api;
    }

    # OAuth for MCP connectors (Claude.ai and others) is served by Django at root level
    location /oauth/ {
      set $api http://api:8000;
      proxy_pass $api;
    }

    location /.well-known/ {
      set $api http://api:8000;
      proxy_pass $api;
    }

    location /ws/ {
      set $api http://api:8000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location /mcp {
      set $mcp http://mcp:8001;
      proxy_pass $mcp;
      proxy_http_version 1.1;
      # the MCP server checks the Host header (DNS-rebinding protection), so keep the public one
      proxy_set_header Host $http_host;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    location / {
      set $web http://web:3000;
      proxy_pass $web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}