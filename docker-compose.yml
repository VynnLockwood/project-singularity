name: singularity

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-singularity}
  DB_APP_USER: singularity_app
  DB_APP_PASSWORD: ${DB_APP_PASSWORD}
  DB_MASTER_RW_USER: singularity_master_rw
  DB_MASTER_RW_PASSWORD: ${DB_MASTER_RW_PASSWORD}
  DB_MASTER_RO_USER: singularity_master_ro
  DB_MASTER_RO_PASSWORD: ${DB_MASTER_RO_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  SINGULARITY_CONFIG: /app/singularity.yaml
  EMBED_URL: http://embed:8080
  BACKUP_DIR: /backups
  MCP_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - mcp
    networks: [edge, internal]
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: /api
    expose: ["3000"]
    networks: [internal]
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    # ASGI (uvicorn) so the same process serves HTTP and the /ws/ WebSocket
    command: sh -c "python manage.py migrate --noinput && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 3 --proxy-headers --forwarded-allow-ips='*'"
    environment:
      <<: *backend-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SCRIPT_DIR: ${SCRIPT_DIR:-/scripts}
    volumes:
      - ./singularity.yaml:/app/singularity.yaml:ro
      - backups:/backups
      - scriptfiles:${SCRIPT_DIR:-/scripts}
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal, egress]
    restart: unless-stopped

  # MCP server: same image and code as the API, separate process. Bearer-token auth,
  # role-filtered tools; every change still goes through the gate and approvals.
  mcp:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: uvicorn mcp_server.app:app --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips='*'
    environment: *backend-env
    volumes:
      - backups:/backups
    expose: ["8001"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, egress]
    restart: unless-stopped

  # Placeholder until Milestone 4/6: Celery worker.
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: sleep infinity
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal, egress]
    restart: unless-stopped

  # multilingual-e5-small on CPU. No internet at runtime: the model is baked into the image at build time.
  embed:
    build: ./embed
    expose: ["8080"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-singularity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MASTER_RW_PASSWORD: ${DB_MASTER_RW_PASSWORD}
      DB_MASTER_RO_PASSWORD: ${DB_MASTER_RO_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # The three role passwords are only set at first init, so a later .env
      # change left them stale (api 500s on every schema read). Sync them on
      # every start instead: cheap, idempotent, no init order dependency.
      - ./db/sync-roles.sh:/sync-roles.sh:ro
    command: ["sh", "-c", "docker-entrypoint.sh postgres & until pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q; do sleep 1; done; /sync-roles.sh; wait"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-singularity}"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose: ["5432"]
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose: ["6379"]
    networks: [internal]
    restart: unless-stopped

networks:
  edge: {}          # nginx <-> host
  internal:
    internal: true  # no internet; db/redis/web live only here
  egress: {}        # outbound internet for api/mcp/worker (Google, OpenRouter)

volumes:
  pgdata: {}
  backups: {}
  scriptfiles: {}
