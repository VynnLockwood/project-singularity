[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
markers =
    slow: scale tests (run by default; deselect with -m "not slow")
    no_default_access: users created in this test get no default `*` grant (tests/conftest.py)
    known_gap: documents an accepted gap (README "Database access"); a failure means the gap was closed
